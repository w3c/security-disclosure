name: Update public security advisory index

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-advisory-index.yml"
      - "scripts/build-advisory-index.mjs"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-public-security-advisories
  cancel-in-progress: false

jobs:
  update-index:
    name: Update advisory index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Check out the generator
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the public advisory index
        run: node source/scripts/build-advisory-index.mjs --output advisories/index.html
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish the index when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- advisories/index.html
          if git diff --cached --quiet; then
            echo "The public advisory index is already current."
            exit 0
          fi
          git commit -m "Update public security advisory index"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
